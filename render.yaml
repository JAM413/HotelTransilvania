services:
  # Backend API
  - type: web
    name: backend-api
    env: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm ci --production=false
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

  # Frontend React
  - type: static
    name: frontend-react
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

